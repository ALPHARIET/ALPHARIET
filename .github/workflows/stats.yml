name: Refresh profile stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile-stats.py
      - .github/workflows/stats.yml

concurrency:
  group: profile-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate public repository card
        run: python scripts/profile-stats.py --owner "${{ github.repository_owner }}"
      - name: Publish card
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          keep_history: true
          allow_empty_commit: false
          build_dir: dist
          commit_message: Refresh public repository stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
